:root{--bg:#4a4b3c;--bd:#1c1d15;--hi:#6e705b;--btn:#5f614d;--btn2:#525442;--acc:#d2473a;--txt:#f1ead6;--mut:#cfc8ae;--dockH:150px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#1d2a3a;color:var(--txt);font-family:'BBNum','Pixelify Sans',ui-monospace,Menlo,monospace;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.pnl{background:var(--bg);border:3px solid var(--bd);box-shadow:inset 0 0 0 2px var(--hi),0 3px 0 rgba(0,0,0,.45);border-radius:6px}
.btn{background:var(--btn);border:2px solid var(--bd);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.14);color:var(--txt);border-radius:5px;font:inherit;font-size:14px;padding:6px 9px;cursor:pointer;line-height:1.1}
.btn:active{transform:translateY(1px)}
.btn.on{background:var(--acc)}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:6px;right:6px;z-index:5;padding:6px 8px;display:flex;align-items:center;gap:8px}
#hl{flex:1;min-width:0}
#title{font-family:'Press Start 2P',monospace;font-size:11px;color:#ffd257;text-shadow:2px 2px 0 #000;letter-spacing:1px;white-space:nowrap}
#stats{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
#speed{display:flex;gap:3px}
#speed .btn{padding:8px 10px;font-size:15px;min-width:44px}#bQuiet{min-width:40px;padding:8px 6px}#bSpd{min-width:72px}
#paused{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);z-index:5;padding:6px 14px;font-size:14px;display:none;cursor:pointer;color:#ffd257}
#ann{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);z-index:8;padding:8px 16px;font-size:17px;font-weight:600;display:none;pointer-events:none;border-width:3px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;text-align:center}
@keyframes annIn{0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
#pad{display:none}#padTop{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:7;padding:5px 12px;font-size:14px;white-space:nowrap;max-width:94vw;text-align:center}
#padHp{height:5px;background:#400;border-radius:3px;margin-top:3px;overflow:hidden}#padHp i{display:block;height:100%;width:100%;background:#e04848}
#stick{position:fixed;left:18px;bottom:calc(var(--dockH) + 18px);width:112px;height:112px;border-radius:50%;background:rgba(28,29,21,.55);border:2px solid rgba(241,234,214,.35);z-index:7;touch-action:none}
#knob{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:rgba(241,234,214,.85);border:2px solid #1c1d15;pointer-events:none}
#pbtns{position:fixed;right:12px;bottom:calc(var(--dockH) + 16px);z-index:7;display:grid;grid-template-columns:repeat(2,64px);gap:8px}
.pb{height:58px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;touch-action:manipulation}.pb small{font-size:10px;margin-top:2px}.pb.rel{background:#6a2a24}
#cine{position:fixed;left:50%;bottom:calc(var(--dockH) + 10px);transform:translateX(-50%);z-index:6;padding:6px 12px;font-size:14px;display:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}#cine span{color:#ff6a5a;cursor:pointer;margin-left:8px;font-weight:600}
.paper{background:#f2ead6;color:#2a241c;font-family:Georgia,'Times New Roman',serif;padding:12px 14px;border:2px solid #1c1d15;border-radius:4px;margin-bottom:8px}
.paper .mast{font-family:'Press Start 2P',monospace;font-size:15px;text-align:center;letter-spacing:1px;border-bottom:3px double #2a241c;padding-bottom:6px}
.paper .sub{text-align:center;font-size:11px;font-style:italic;border-bottom:1px solid #2a241c;padding:3px 0 5px;margin-bottom:8px}
.paper .hl{font-size:19px;font-weight:700;line-height:1.2;margin:4px 0 8px}.paper .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;line-height:1.35}.paper p{margin-bottom:6px}
.paper .cartoon{border:2px solid #2a241c;margin-top:8px;padding:8px;text-align:center;background:#fff9ea}.paper .ce{font-size:30px;letter-spacing:4px;margin-bottom:4px}
.opt{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 10px}
#side{position:fixed;right:6px;top:calc(env(safe-area-inset-top) + 66px);z-index:5;display:flex;flex-direction:column;gap:5px}
#side .btn{width:42px;height:42px;font-size:19px;padding:0}
#news{position:fixed;left:6px;top:calc(env(safe-area-inset-top) + 66px);width:min(340px,calc(100vw - 64px));z-index:4;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.ni{pointer-events:auto;font-size:12px;line-height:1.25;padding:4px 7px;background:rgba(28,29,21,.88);border:2px solid #1c1d15;border-left:4px solid #ffd257;border-radius:4px;transition:opacity .8s;cursor:pointer}
.ni small{color:#a59f88}
#curPow{position:fixed;left:8px;bottom:calc(var(--dockH) + 10px);z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px}
#curPow .ic{font-size:24px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#2e2f24;border:2px solid var(--bd);border-radius:4px}
#curPow .x{color:#ff6a5a;font-size:16px;cursor:pointer;padding:2px 8px;font-weight:600}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6}
#tabs{display:flex;justify-content:center;gap:3px;padding:0 6px;position:relative;z-index:2;margin-bottom:-3px}
.tab{width:42px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--btn2);border:3px solid var(--bd);border-bottom:none;border-radius:9px 9px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.14);cursor:pointer;margin-top:4px}
.tab.on{background:var(--acc);height:38px;margin-top:0}
#pane{border-radius:0;border-left:none;border-right:none;border-bottom:none;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);max-height:38vh;overflow-y:auto;touch-action:pan-y}
#pane.min .body{display:none}
#hint{font-size:13px;color:var(--mut);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint b{color:#ffd257}
.groups{display:flex;flex-wrap:wrap;gap:8px 0}
.grp{display:flex;flex-wrap:wrap;gap:5px;padding:0 7px;border-right:3px solid #35362a;align-content:flex-start}
.grp:last-child{border-right:none}
.pw{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--btn);border:2px solid var(--bd);border-radius:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.14);cursor:pointer;position:relative}
.pw.on{background:var(--acc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 0 0 2px #ffd257}
.pw.red{background:#b8382c}
.subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;padding:4px 6px;display:flex;align-items:center;gap:4px}
.chip i{display:inline-block;width:10px;height:10px;border:1px solid #000;border-radius:2px}
#sheet{position:fixed;left:6px;right:6px;bottom:calc(var(--dockH) + 6px);max-height:min(56vh,calc(100vh - var(--dockH) - 90px));overflow:auto;z-index:7;padding:10px 12px;display:none;font-size:13px;line-height:1.45;touch-action:pan-y}
#sheet h3{font-size:16px;display:flex;align-items:center;gap:6px;margin-bottom:4px}
#sheet .x{margin-left:auto}
#sheet .row{color:var(--mut)}
#sheet .sec{margin-top:8px;color:#ffd257;font-weight:600;font-size:12px;letter-spacing:.5px}
.lnk{color:#9fd8ff;text-decoration:underline;cursor:pointer}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:#b4ad94;margin-top:3px}
.bar{position:relative;height:8px;background:linear-gradient(90deg,#5a6aa0,#3a3b30 50%,#a06a58);border:1px solid #1c1d15;border-radius:3px;margin:2px 0 4px}
.bar i{position:absolute;top:-4px;width:6px;height:14px;background:#ffd257;border:1px solid #000;border-radius:2px;transform:translateX(-50%)}
.meter{height:8px;background:#2e2f24;border:1px solid #1c1d15;border-radius:3px;overflow:hidden;margin:2px 0 4px}.meter i{display:block;height:100%;background:#7ad06a}
.life{font-size:12px;max-height:130px;overflow:auto;color:#c9c2a8}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 8px}.tile{background:#2e2f24;border:2px solid #1c1d15;border-radius:5px;padding:6px 8px}
.tl{font-size:11px;color:#b4ad94}.tv{font-size:20px;font-weight:600;color:#f1ead6;line-height:1.3}.tv small{font-size:12px}.ts{font-size:11px;color:#cfc8ae;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;border:1px solid #000;font-size:11px;color:#111;font-weight:600}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px}
#mbox{width:min(480px,100%);max-height:84vh;overflow:auto;padding:14px;font-size:13px;line-height:1.5;touch-action:pan-y}
#mbox h2{font-size:17px;color:#ffd257;margin-bottom:8px}
#mbox canvas{width:100%;background:#2e2f24;border:2px solid #1c1d15;border-radius:4px;margin:4px 0 8px;display:block}
.li{padding:7px 6px;border-bottom:1px solid #35362a;cursor:pointer}
.li:active{background:#5f614d}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;padding:8px 14px;display:none;font-size:14px}
#start{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 35%,#3a4a3a,#12140f 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#start h1{font-family:'Press Start 2P',monospace;font-size:clamp(24px,8vw,48px);color:#ffd257;letter-spacing:2px;text-shadow:4px 4px 0 #000;line-height:1.2}
#start h1 b{color:#f1ead6}
#start p{color:#cfc8ae;font-size:15px;max-width:380px}
#start .btn{font-size:17px;padding:12px 22px;min-width:220px}
#start .ic{font-size:40px;letter-spacing:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="pnl">
  <div id="hl"><div id="title">BALLOT<b style="color:#f1ead6">&amp;</b>BONE</div><div id="stats"></div></div>
  <div id="speed"><button class="btn" id="bPause" title="Pause / play">⏸</button><button class="btn" id="bSpd" title="Change speed">⏩ 1x</button><button class="btn" id="bQuiet" title="Show / hide world event notifications">🔔</button></div>
</div>
<div id="side">
  <button class="btn" id="bNat" title="Nations">🏛</button>
  <button class="btn" id="bStats" title="World stats">📊</button>
  <button class="btn" id="bHist" title="History">📜</button>
  <button class="btn" id="bLayer" title="Map layer">🗺️</button>
  <button class="btn" id="bPaper" title="Newspaper">📰</button>
  <button class="btn" id="bCine" title="Cinematic camera">🎥</button>
</div>
<div id="news"></div>
<div id="ann" class="pnl"></div>
<div id="cine" class="pnl"></div>

// yearly survey: find road pieces in a town's land that connect to nothing (no building, no hall), and old roads to repave
function roadSurvey(){const seen=new Uint8Array(N),q=[];const junk=new Map(),rep=new Map();
 for(let s0=0;s0<N;s0++){if(!road[s0]||seen[s0])continue;const comp=[];let att=false;q.length=0;q.push(s0);seen[s0]=1;
  while(q.length){const c=q.pop();comp.push(c);const x=c%W,y=(c/W)|0;for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=ny*W+nx;if(bld[j])att=true;if(road[j]&&!seen[j]){seen[j]=1;q.push(j)}}}
  // dangling spurs: tiles with exactly one road neighbour and no building, peeled off big networks a step at a time
  const tid=owner[s0];if(!tid)continue;
  if(!att||comp.length<=2&&!att){if(!junk.has(tid))junk.set(tid,[]);junk.get(tid).push(...comp)}
  else if(comp.length>6)for(const c of comp){const x=c%W,y=(c/W)|0;let rn=0,bn=0;for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=ny*W+nx;if(road[j])rn++;if(bld[j])bn++}
   if(rn===1&&bn===0&&traffic[c]<45){if(!junk.has(tid))junk.set(tid,[]);junk.get(tid).push(c)}}}
 for(const t of towns){const lv=t.era>=6?3:t.era>=4?2:1;t.roadJunk=(junk.get(t.id)||[]).filter(i=>owner[i]===t.id).slice(0,40);
  if(lv>1){const r=[];const R_=Math.ceil(5+Math.sqrt(t.pop)*1.6);for(let y=t.cy-R_;y<=t.cy+R_;y++)for(let x=t.cx-R_;x<=t.cx+R_;x++){if(!inb(x,y))continue;const i=y*W+x;if(road[i]&&road[i]<lv&&owner[i]===t.id)r.push(i)}t.repave=r.slice(0,40)}else t.repave=[]}}
function roadThink(p,t){const L=(t.roadJunk||[]).filter(i=>road[i]),Rp=(t.repave||[]).filter(i=>road[i]);if(!L.length&&!Rp.length)return false;
 const pickNear=a=>{let b=-1,bd=1e9;for(const i of a){const d=Math.hypot((i%W)*T+4-p.x,((i/W)|0)*T+4-p.y)+R()*20;if(d<bd){bd=d;b=i}}return b};
 const useJunk=L.length&&(R()<.75||!Rp.length);const i=pickNear(useJunk?L:Rp);if(i<0)return false;
 // spread crews out
 if(useJunk)t.roadJunk=L.filter(j=>j!==i).concat([i]);else t.repave=Rp.filter(j=>j!==i).concat([i]);
 goT(p,i,useJunk?'unroad':'repave');return true}

function ruinDecay(){for(const b of buildings.slice()){if(b.type!=='ruin')continue;if(b.ruinY===undefined){b.ruinY=year-ri(0,15);continue}
  const age=year-b.ruinY;const i=b.y*W+b.x;if(age>25+hash(b.id,41)*20||(owner[i]&&age>8&&R()<.15)){removeBld(b);if(ter[i]===GRASS&&R()<.5)bare[i]=Math.max(bare[i],3);drawTileN(i)}}}
function cleanTile(i,fx_){if(bld[i]){const b=BL.get(bld[i]);if(b&&b.type==='ruin'){removeBld(b);if(fx_)burst(b.x*T+4,b.y*T+4,'#b8b0a0',6)}}
 let ch=false;if(scorch[i]){scorch[i]=0;ch=true}if(bare[i]){bare[i]=0;ch=true}if(!owner[i]&&road[i]&&!bld[i]){road[i]=0;traffic[i]=0;ch=true}if(ch)drawTile(i)}
function reforestTile(i,fx_){if(ter[i]!==GRASS||bld[i]||road[i])return;ter[i]=FOREST;res[i]=6;bush[i]=0;bare[i]=0;drawTileN(i);if(fx_&&R()<.2)burst((i%W)*T+4,((i/W)|0)*T+4,'#4a8a3a',3)}
function restoreWorld(){let ru=0;for(const b of buildings.slice())if(b.type==='ruin'){removeBld(b);ru++}let sc=0;for(let i=0;i<N;i++){if(scorch[i]||bare[i]){scorch[i]=0;bare[i]=0;sc++}if(!owner[i]&&road[i]&&!bld[i]){road[i]=0;traffic[i]=0}}
 // replant wild land: grow forest clusters on unclaimed grass away from towns
 let fo=0;const seeds=[];for(let i=0;i<N;i++)if(ter[i]===GRASS&&!owner[i]&&!bld[i]&&!road[i]&&bio[i]!==B_DES&&R()<.012)seeds.push(i);
 for(const s of seeds){const x=s%W,y=(s/W)|0;if(nearTownCenter(x,y,7))continue;const r=ri(1,3);for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(!inb(nx,ny)||dx*dx+dy*dy>r*r+R()*2)continue;const j=ny*W+nx;if(ter[j]===GRASS&&!owner[j]&&!bld[j]&&!road[j]){ter[j]=FOREST;res[j]=6;bush[j]=0;fo++}}}
 renderTerrain();terrDirty=true;if(typeof drawOverlay==='function')drawOverlay();toast(`🧹 Cleared ${ru} ruins and ${sc} scarred tiles · planted ${fo} forest tiles`);news(`🧹 The gods swept the world clean. Wild forests are returning.`,0,0,false)}
// frontier: the emptiest valid spot on a landmass, far from every town and province
function frontierSite(lm,from,maxD){let best=-1,bs=0;const ctrs=[];for(const o of towns){ctrs.push([o.cx,o.cy]);for(const v of o.prov||[])ctrs.push([v.x,v.y])}
 for(let k=0;k<700;k++){const i=Math.floor(R()*N);if(land[i]!==lm||owner[i])continue;const x=i%W,y=(i/W)|0;if(from&&maxD&&Math.hypot(x-from.cx,y-from.cy)>maxD)continue;if(!validSite(i,10))continue;
  let md=1e9;for(const c of ctrs){const d=Math.hypot(c[0]-x,c[1]-y);if(d<md)md=d}if(md<16)continue;const sc=md+R()*6;if(sc>bs){bs=sc;best=i}}return best}

function damageBld(b,amt,cause,byTown){if(!b||b.type==='ruin')return;if(b.hp===undefined||b.hp>1)b.hp=1;b.hp-=amt;const t=TW.get(b.town);
 if(t){t.dmgT=year;t.rebuildT=Math.max(t.rebuildT||0,3);if(!t.dmgList)t.dmgList=[];if(!t.dmgList.includes(b.id))t.dmgList.push(b.id);
  t.patriot=Math.min(1.2,(t.patriot||0)+amt*.35);if(!t.patNews||year-t.patNews>6){if(t.patriot>.35&&t.pop>8){t.patNews=year;const by=TW.get(byTown);news(`🫡 ${by?`${by.name}'s`:'The'} bombing of ${t.name} sparked a surge of patriotism. Volunteers flood the recruiting offices.`,t.cx*T,t.cy*T,false,false);for(const p of t.mem)if(!p.dead&&!p.robot&&p.age>=16&&R()<.25)bub(p,pick(['🫡','✊','🎖️','😠']),3)}}}

function repairTarget(p,t){if(!t.dmgList||!t.dmgList.length)return null;let best=null,bd=1e9;for(let k=t.dmgList.length-1;k>=0;k--){const b=BL.get(t.dmgList[k]);if(!b||b.town!==t.id||b.hp>=.999){t.dmgList.splice(k,1);continue}const d=Math.abs(b.x*T-p.x)+Math.abs(b.y*T-p.y);if(d<bd){bd=d;best=b}}return best}

 const builder=p.job==='builder'||p.job==='roadworker';const chance=builder?.85:(t.rebuildT>0&&!(t.campBy&&simT-t.campT<4))?.3:0;if(R()>=chance)return false;const b=repairTarget(p,t);if(!b)return false;goB(p,b,'repair');return true}
function repairDone(p,t){const b=BL.get(p.task.b);if(!b||!t||b.town!==t.id)return;const was=b.hp;b.hp=Math.min(1,(b.hp||0)+.12+(p.job==='builder'?.08:0));spark(b.x*T+4,b.y*T+2,'#e0c080');
 if(was<.999&&b.hp>=.999){if(t.dmgList)t.dmgList=t.dmgList.filter(id=>id!==b.id);if(!t.dmgList.length&&t.rebuildT>0&&!t.rebuiltNews){t.rebuiltNews=year;news(`🔨 The people of ${t.name} came together and rebuilt their town.`,b.x*T,b.y*T,false,true)}}}
function patriotYear(t){if(t.patriot>0){t.patriot=Math.max(0,t.patriot*.75-.03);t.mood+=Math.min(.03,t.patriot*.03);t.unrest=Math.max(0,t.unrest-t.patriot*.08);if(t.approval!==undefined)t.approval=Math.min(1,t.approval+t.patriot*.04)}
 if(t.rebuildT>0)t.rebuildT--;if(t.rebuiltNews&&year-t.rebuiltNews>8)t.rebuiltNews=0;
 // slowly weathering damage heals a little on its own only for tiny dents
 if(t.dmgList)for(const id of t.dmgList){const b=BL.get(id);if(b&&b.hp>.85)b.hp=Math.min(1,b.hp+.05)}}
function drawDamage(b,x,y,w,h){const d=1-(b.hp===undefined?1:Math.min(1,b.hp));if(d<.18)return;const H=k=>hash(b.id*13+k,9);
 // cracks
 ctx.save();ctx.strokeStyle='rgba(28,20,16,.8)';ctx.lineWidth=.32;ctx.lineJoin='miter';const nc=Math.min(5,Math.ceil(d*6));for(let k=0;k<nc;k++){let cx=x+w*(.18+H(k)*.64),cy=y+h*(.25+H(k+20)*.45);ctx.beginPath();ctx.moveTo(cx,cy);const L=3+Math.round(d*4);for(let s=0;s<L;s++){cx+=(H(k*7+s)-.5)*1.6;cy+=.55+H(k*5+s)*.5;ctx.lineTo(cx,cy);if(s===1&&d>.35){ctx.moveTo(cx,cy);ctx.lineTo(cx+(H(k+90)<.5?-1:1)*1.1,cy+.7);ctx.moveTo(cx,cy)}}ctx.stroke()}ctx.restore();

  ctx.globalAlpha=.25+d*.35;ctx.fillStyle='#1a1410';ctx.fillRect(x+w*(.1+H(31)*.5),y+h*(.1+H(32)*.3),w*.28,h*.22);ctx.globalAlpha=1;
  const left=H(40)<.5,hx=x+(left?w*.08:w*.55),hw=w*.38,hy=y+h*.08;ctx.fillStyle='#1e1814';ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+hw,hy+h*.04);ctx.lineTo(hx+hw*.7,hy+h*.22*d+1);ctx.lineTo(hx+hw*.25,hy+h*.28*d+.8);ctx.closePath();ctx.fill();ctx.fillStyle='#6a4a2a';for(let k=0;k<3;k++)ctx.fillRect(hx+hw*(.15+k*.28),hy+.3,.45,h*.18*d+.6)}
 if(d>.6){// rubble at the base, embers, smoke
  for(let k=0;k<6;k++){ctx.fillStyle=k%2?'#8a8278':'#6a6258';ctx.fillRect(x+w*H(60+k),y+h-1.2+H(70+k)*.8,1.2+H(80+k),1)}
  if(Math.sin(simT*9+b.id)>.3){ctx.fillStyle='#ff8a2a';ctx.fillRect(x+w*H(90),y+h*.55,.8,.8)}

function lookAt(x,y){camX=x-SW/zoom/2;camY=y-SH/zoom/2;followId=0}
function s2w(sx,sy){return[camX+sx/zoom,camY+sy/zoom]}
const ptrs=new Map();let drag=null,pinch=null,painting=false;
const isBrush=()=>tool.startsWith('p_')||tool.startsWith('b_');
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){ptrs.clear();pinch=null;if(e.button!==0&&e.button!==1)return}else{for(const[id,v]of ptrs)if(v.type==='mouse')ptrs.delete(id)}try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
 if(ptrs.size===1){drag={sx:e.clientX,sy:e.clientY,cx:camX,cy:camY,t:performance.now(),moved:false};if(isBrush()&&running){painting=true;const[wx,wy]=s2w(e.clientX,e.clientY);paintAt(wx,wy)}}
 else if(ptrs.size===2){painting=false;drag=null;const[a,b]=[...ptrs.values()];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:zoom,wx:camX+mx/zoom,wy:camY+my/zoom}}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;if(e.pointerType==='mouse'&&e.buttons===0){endPtr(e);return}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,type:e.pointerType});
 if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;zoom=clamp(pinch.z*d/pinch.d,minZoom(),10);camX=pinch.wx-mx/zoom;camY=pinch.wy-my/zoom;followId=0;return}
 if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>8)drag.moved=true;
 if(painting){const[wx,wy]=s2w(e.clientX,e.clientY);paintAt(wx,wy);return}
 if(drag.moved){if(cine)setCine(false);camX=drag.cx-dx/zoom;camY=drag.cy-dy/zoom;followId=0}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(drag&&!drag.moved&&!painting&&ptrs.size===0&&performance.now()-drag.t<600&&running){const hit=tool==='inspect'&&labelRects.find(r=>e.clientX>=r[0]&&e.clientX<=r[0]+r[2]&&e.clientY>=r[1]&&e.clientY<=r[1]+r[3]);
  if(possessId&&(tool==='inspect'||tool==='possess')){const[wx,wy]=s2w(e.clientX,e.clientY);const pp=P.get(possessId);if(pp){pp.walkTo=[wx,wy];floatText(wx,wy-2,'•','#ffd257',false)}}
  else if(hit&&TW.get(hit[4])){sel={k:'t',id:hit[4]};renderSheet()}else{const[wx,wy]=s2w(e.clientX,e.clientY);applyTool(wx,wy)}}
 if(ptrs.size===0){painting=false;drag=null}if(ptrs.size<2)pinch=null;if(ptrs.size===1)drag=null}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);cv.addEventListener('lostpointercapture',e=>{if(ptrs.has(e.pointerId)){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){drag=null;painting=false}}});
addEventListener('blur',()=>{ptrs.clear();pinch=null;drag=null;painting=false});
cv.addEventListener('wheel',e=>{e.preventDefault();const[wx,wy]=s2w(e.clientX,e.clientY);
 const mouseWheel=e.deltaMode===1||(e.deltaX===0&&Math.abs(e.deltaY)>=50&&Number.isInteger(e.deltaY));

 else{camX+=e.deltaX/zoom;camY+=e.deltaY/zoom;followId=0}},{passive:false});

<p><b>Politics happens by itself.</b> Everyone sits somewhere on three scales: Authority↔Liberty, Market↔Collective and Tradition↔Progress, which gives them an ideology (Communist, Liberal, Fascist, Anarchist, Conservative and many more as eras advance). Big enough groups form <b>parties</b>. Parties compete in elections, strike, purge, assassinate, start civil wars and revolutions, or break away to found their own nations. Activists wear their party's color.</p><br>
<p><b>Eras.</b> Towns advance from the Stone Age to the Ascendant Age. Clothes, weapons, buildings, boats and governments change as they go.</p><br>
<p><b>Controls.</b> Drag to move, pinch or scroll to zoom. Pick a category tab at the bottom, then a power, then tap the map. The ✕ on the left goes back to Inspect. 🗺️ switches between national borders and an ideology map. Tap a headline to jump to it.</p><br>
<button class="btn" data-a="close">Got it</button>`)}

// ================= SAVE / LOAD =================
function strip(o,keys){const r={};for(const k in o)if(!keys.includes(k))r[k]=o[k];return r}
const A=a=>Array.from(a);
function save(quiet,ret){try{const d={v:2,wc:worldCode,wd:worldDesc,W,H,seed,year,yearT,simT,pid,tid,fid,bid,cid,mid,colorIdx,ter:A(ter),res:A(res).map(v=>Math.round(v*10)/10),bush:A(bush),gold:A(gold),scorch:A(scorch),bio:A(bio),road:A(road),bare:A(bare),
 people:people.filter(p=>!p.dead).map(p=>p.onBoat?{...p,onBoat:0}:p),towns:towns.map(t=>strip(t,['mem','sold','blds','sites','dock'])),parties:parties.map(f=>strip(f,['mem'])),buildings,migs:migs.map(g=>({...g,boat:0,sailed:true})),
 cres:cres.filter(c=>c.hp>0).map(c=>({...c,tgt:null})),ghosts:[...ghosts.values()].slice(-2500),graves,religions,rlid,newsLog:newsLog.slice(-300).map(n=>strip(n,['at'])),stats,laws,camX,camY,zoom,layer,w2:{UN,routes,crash,doom,coldWars,rtid,CLIM,SPACE,SING,INF:infraSave()}};
 if(ret)return d;const js=JSON.stringify(d);try{localStorage.setItem(KEY,js);idbOp('w','readwrite',s=>s.delete(0)).catch(()=>{})}catch(e){try{localStorage.removeItem(KEY)}catch(_){}idbOp('w','readwrite',s=>s.put(js,0)).then(()=>{if(!quiet)toast('💾 World saved')}).catch(()=>{if(!quiet)toast('Save failed (storage full?)')});return}if(!quiet)toast('💾 World saved')}catch(e){if(!quiet)toast('Save failed (storage full?)')}}
function hasSave(){try{return!!localStorage.getItem(KEY)}catch(e){return false}}
function load(dd){let d;try{d=dd||JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){d=null}if(!d||!d.ter)return false;
 resetState();W=d.W||128;H=d.H||88;seed=d.seed;year=d.year;yearT=d.yearT;simT=d.simT||0;pid=d.pid;tid=d.tid;fid=d.fid;bid=d.bid;cid=d.cid||1;mid=d.mid||1;colorIdx=d.colorIdx||0;allocMaps();
 ter=Uint8Array.from(d.ter);res=Float32Array.from(d.res);bush=Uint8Array.from(d.bush);gold=Uint8Array.from(d.gold);scorch=Uint8Array.from(d.scorch);bio=Uint8Array.from(d.bio);road=Uint8Array.from(d.road);bare=d.bare?Uint8Array.from(d.bare):new Uint8Array(N);
 {const tpl=mkPerson(0,0,null,null);people.pop();P.delete(tpl.id);pid--;const ks=Object.keys(tpl);people=d.people.map(o=>{const n={};for(const k of ks)n[k]=k in o?o[k]:tpl[k];for(const k in o)if(!(k in n))n[k]=o[k];return n})}people.forEach(p=>{P.set(p.id,p);p.summit=null;if(!p.tr)p.tr=[];p.st='idle';p.tt=0;p.task=null;p.embark=0;p.strand=-1;if(p.mig&&!migsHas(d.migs,p.id))p.mig=null});
 towns=d.towns;towns.forEach(t=>{TW.set(t.id,t);t.mem=[];t.sold=[];t.blds={};t.sites=[];t.dock=null});
 parties=d.parties||[];parties.forEach(f=>FA.set(f.id,f));buildings=d.buildings;buildings.forEach(b=>{BL.set(b.id,b);bld[b.y*W+b.x]=b.id});
 cres=d.cres||[];cres.forEach(c=>CR.set(c.id,c));ghosts=new Map((d.ghosts||[]).map(g=>[g.id,g]));graves=d.graves||[];religions=d.religions||[];RL=new Map(religions.map(r=>[r.id,r]));rlid=d.rlid||1;migs=(d.migs||[]).map(g=>({...g,sea:null}));for(const g of migs)for(const id of g.ids){const p=P.get(id);if(p&&p.mig)p.mig={x:g.x,y:g.y}}
 newsLog=(d.newsLog||[]).map(n=>({...n,at:0}));stats=d.stats||stats;worldCode=d.wc||'';worldDesc=d.wd||worldDesc;if(d.w2){UN=d.w2.UN||null;routes=d.w2.routes||[];crash=d.w2.crash||0;doom=d.w2.doom||12;coldWars=d.w2.coldWars||[];rtid=d.w2.rtid||1;if(d.w2.CLIM)CLIM=d.w2.CLIM;if(d.w2.SPACE)SPACE=d.w2.SPACE;if(d.w2.SING)SING=d.w2.SING;infraReset();if(d.w2.INF)infraLoad(d.w2.INF)}Object.assign(laws,d.laws||{});camX=d.camX;camY=d.camY;zoom=d.zoom||2.5;layer=d.layer??1;
 calcLand();renderTerrain();initClouds();rebuildCache();calcTerritory();startGame();toast('📂 World loaded');return true}
function migsHas(ms,id){return(ms||[]).some(g=>g.ids.includes(id))}
function resetState(){infraReset();ghosts=new Map();graves=[];religions=[];RL=new Map();rlid=1;if(cine)setCine(false);cars=[];shots=[];fights=[];hot=[];ftexts=[];people=[];towns=[];parties=[];buildings=[];migs=[];parts=[];fx=[];bones=[];rockets=[];cres=[];boats=[];P=new Map();TW=new Map();FA=new Map();BL=new Map();CR=new Map();fireSet=new Set();
 pid=1;tid=1;fid=1;bid=1;cid=1;boid=1;mid=1;year=0;simT=0;yearT=0;cacheT=0;cleanT=0;halfDone=false;colorIdx=0;newsLog=[];shown=[];followId=0;sel=null;hostileN=0;birds=[];ords=[];UN=null;routes=[];caravans=[];crash=0;doom=12;coldWars=[];rtid=1;CLIM={temp:0,co2:280,hist:[],sea:0,melt:0,fires:0,flooded:0};SPACE={stage:{},firsts:{},log:[],mars:[],sats:0,moonFlags:[],station:0,ark:0};SING={done:0,kind:null,y:0,bias:0,riots:0};if(possessId){possessId=0;$('pad').style.display='none';$('news').style.visibility=''}
 stats={hist:[],c:{rev:0,coup:0,civil:0,elec:0,war:0,purge:0,battle:0,monster:0,assas:0,strike:0,secede:0,emig:0}};closeSheet()}

// ================= START =================
function seedTribes(n){let big=0;for(let i=1;i<landSize.length;i++)if(landSize[i]>landSize[big])big=i;
 const placed=[];
 for(let k=0;k<n;k++){let site=-1;for(let a=0;a<900;a++){const i=Math.floor(R()*N);if(land[i]<0||landSize[land[i]]<(a<500?landSize[big]*.6:120)||ter[i]!==GRASS||!validSite(i,12))continue;const x=i%W,y=(i/W)|0;if(placed.some(q=>Math.hypot(q[0]-x,q[1]-y)<24))continue;site=i;break}
  if(site<0)continue;const x=site%W,y=(site/W)|0;placed.push([x,y]);
  const bias=[rnd(-.7,.7),rnd(-.7,.7),rnd(-.7,.2)];
  const mem=[];for(let j=0;j<6;j++){const p=mkPerson(x*T+4+rnd(-12,12),y*T+6+rnd(-10,10),null);p.age=ri(15,30);p.sex=j%2?'m':'f';p.hs=p.sex==='f'?pick([1,1,2,5,0]):pick([0,0,0,3,4]);p.beard=p.sex==='m'&&R()<.4;p.v=bias.map(v=>clamp(v+rnd(-.45,.45),-1,1));mem.push(p)}
  for(let j=0;j<3;j++){const fp=mem[j*2],mp=mem[j*2+1];if(R()<.7){fp.partner=mp.id;mp.partner=fp.id;mp.sur=fp.sur}else mp.sur=pick(SUR)}
  for(let j=0;j<2;j++){const c=mkPerson(x*T+4,y*T+6,null,[mem[0],mem[1]]);c.age=ri(3,10);c.sur=mem[1].sur;mem.push(c);mem[0].kids.push(c.id);mem[1].kids.push(c.id)}
  for(const p of mem){const k=people.indexOf(p);if(k>=0)people.splice(k,1);P.delete(p.id)}spawnTribe(x,y,bias)}
 return placed}
function newWorld(sd){resetState();const ty=mapType==='random'?pick(Object.keys(MAPTYPE).filter(k=>k!=='earth')):mapType;const s0=sd??Math.floor(Math.random()*1e9);genWorld(s0,mapSize,ty,mapClimate);worldCode=makeCode(ty,worldClim,mapSize,s0);news(`🌍 A new world was born: ${worldDesc}.`);const nT=mapTribes==='normal'?({small:3,medium:4,large:6,huge:8}[mapSize]||4):mapTribes==='many'?({small:5,medium:8,large:12,huge:16}[mapSize]||8):TRIBEN[mapTribes];const pl=nT?(ty==='earth'?seedEarthTribes({few:5,normal:9,many:15}[mapTribes]||9):seedTribes(nT)):[];if(!nT)setTimeout(()=>toast('🏕️ No tribes yet: use Found Tribe in the Life tab to place your own'),600);seedAnimals();if(mapSize==='large'||mapSize==='huge')seedAnimals();if(mapSize==='huge')seedAnimals();
 zoom=clamp(Math.min(SW,SH)/140,1.8,3.4);if(pl.length)lookAt(pl[0][0]*T,pl[0][1]*T);else lookAt(W*T/2,H*T/2);startGame()}

$('bNew').onclick=()=>newWorldMenu(false);

$('bQuiet').onclick=()=>setQuiet(!quietUI);$('bQuiet').textContent=quietUI?'🔕':'🔔';$('bQuiet').classList.toggle('on',quietUI);

if(hasSave())$('bCont').style.display='block';else idbOp('w','readonly',s=>s.get(0)).then(v=>{if(v)$('bCont').style.display='block'}).catch(()=>{});

 applyTool,setTool:t=>{tool=t},setIdeo:k=>{ideoPick=k},save,load,lookAt,setZoom:z=>{zoom=z},zoomNow:()=>zoom,showStats,renderSheet,sel:v=>{sel=v;renderSheet()}};
